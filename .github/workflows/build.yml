name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: x86
      - run: python -m pip install PyQt5 pyinstaller
      - run: python tests/run_all.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Real-Qt smoke test (offscreen)
        run: python tests/smoke_qt.py
        env:
          QT_QPA_PLATFORM: offscreen
      - run: >
          python -m PyInstaller --noconfirm --clean --windowed --name myzcanpro --onedir run_app.py
          --hidden-import zdiag --hidden-import zdiag_ui --exclude-module PySide2 --exclude-module tkinter
      - name: Copy vendor files (optional)
        shell: bash
        run: if [ -d vendor ]; then cp -r vendor/. dist/myzcanpro/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: myzcanpro-win32
          path: dist/myzcanpro
